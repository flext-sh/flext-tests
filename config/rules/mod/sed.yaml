# Declarative one-way cutover from typing-owned adapter instances to utility calls.
rules:
  - id: remove-runtime-adapters-from-base-types
    include: [src/flext_tests/_typings/base.py]
    find: '(?ms)^    TESTOBJECT_SERIALIZABLE_ADAPTER:.*?^    STR_SEQUENCE_MAPPING_ADAPTER:.*?^    \)\n'
    replace: ''
  - id: remove-unused-sequence-import-after-adapter-cutover
    include: [src/flext_tests/_typings/base.py]
    find: '^    Sequence,\n'
    replace: ''
    flags: [MULTILINE]
  - id: remove-core-utility-import-from-base-types
    include: [src/flext_tests/_typings/base.py]
    find: '^from flext_core import p, u$'
    replace: 'from flext_core import p'
    flags: [MULTILINE]
  - id: remove-runtime-adapter-from-make-types
    include: [src/flext_tests/_typings/make.py]
    find: '^    MAKE_TOML_TABLE_ADAPTER:.*\n'
    replace: ''
    flags: [MULTILINE]
  - id: remove-constructor-import-from-make-types
    include: [src/flext_tests/_typings/make.py]
    find: '^from flext_core import m, t, u$'
    replace: 'from flext_core import t'
    flags: [MULTILINE]
  - id: use-core-adapter-utility-in-make-parsing
    include: [src/flext_tests/_utilities/make_parsing.py]
    find: '^from flext_core import r$'
    replace: 'from flext_core import r, u as core_u'
    flags: [MULTILINE]
  - id: construct-make-table-adapter-at-use
    include: [src/flext_tests/_utilities/make_parsing.py]
    find: 't\.Tests\.MAKE_TOML_TABLE_ADAPTER\.validate_python\('
    replace: 'core_u.type_adapter(t.Tests.MakeTomlTable).validate_python('
  - id: use-core-adapter-utility-in-file-reading
    include: [src/flext_tests/_utilities/_files/_reading.py]
    find: '^from flext_core import r$'
    replace: 'from flext_core import r, u as core_u'
    flags: [MULTILINE]
  - id: construct-json-mapping-adapter-at-use
    include: [src/flext_tests/_utilities/_files/_reading.py]
    find: 't\.Tests\.TESTOBJECT_MAPPING_ADAPTER\.validate_json\('
    replace: 'core_u.type_adapter(t.MappingKV[str, t.Tests.TestobjectSerializable], config=m.ConfigDict(arbitrary_types_allowed=True)).validate_json('
