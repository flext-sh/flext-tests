# Handwritten topology SSOT consumed by `flext-infra codegen conform`.
# conform never overwrites this input. Declare members/exclusions here, then
# run the project's canonical generation surface (`make gen`).
version: 3
name: flext-tests
# Why (green mandate, cosmos-3flk9 decision A): production sources are the
# namespace validator's declared scope — tests host pytest conventions and
# scripts/examples are thin command and documentation surfaces. Lint, type,
# constant, and magic-value rules stay fleet-tree-wide.
namespace_scan_dirs:
  - src
repository:
  name: flext-tests
  distribution: flext-tests
  provider: flext-sh
  url: https://github.com/flext-sh/flext-tests.git
  path: .
  role: standalone
  state: active
  kind: internal_flext
  codegen: conform
  package: true
  editable: true
  read_only: false
project:
  package_name: flext_tests
  class_stem: FlextTests
  namespace: Tests
  constant_name: flext-tests
  namespace_attribute: tests
  alias: tests
  environment_prefix: FLEXT_TESTS_
  description: >-
    FLEXT Test Infrastructure - Shared test utilities, builders, factories,
    and validation for the FLEXT ecosystem
  license: MIT
  author_name: FLEXT Team
  author_email: team@flext.sh
  upstream: flext_cli
  homepage: https://github.com/flext-sh/flext-tests
  documentation: https://github.com/flext-sh/flext-tests/blob/main/README.md
  repository_root_rel: .
  year: 2026
  runtime_dependency_overlay:
    - hypothesis
    - pytest-asyncio
    - pytest-benchmark
    - pytest-cov
    - pytest-markdown-docs
    - pytest-randomly>=4.1.0
    - pytest-reportlog
    - pytest-testmon>=2.2.0
    - pytest-xdist
members: []
